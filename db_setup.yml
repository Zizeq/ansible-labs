---
- name: Database installation and network configuration
  hosts: db_servers
  become: yes
  vars_files:
    - secrets.yml
  vars:
    app_server_ip: "{{ hostvars[groups['app_servers'][0]]['ansible_host'] }}"

  tasks:
    - name: Step 1 - Install required packages (acl, ufw, postgres)
      apt:
        name:
          - acl
          - ufw
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
        update_cache: yes

    - name: Step 2 - Create the database user
      community.postgresql.postgresql_user:
        name: "{{ vault_db_user }}"
        password: "{{ vault_db_password }}"
        role_attr_flags: "NOSUPERUSER,CREATEDB"
      become_user: postgres

    - name: Step 3 - Create the database
      community.postgresql.postgresql_db:
        name: "{{ vault_db_name }}"
        owner: "{{ vault_db_user }}"
      become_user: postgres

    - name: Step 4 - Allow Postgres to listen on all interfaces
      lineinfile:
        path: /etc/postgresql/14/main/postgresql.conf
        regexp: "^#?listen_addresses ="
        line: "listen_addresses = '*'"
      notify: Restart Postgres

    - name: Step 5 - Add pg_hba.conf entry allowing login from app IP
      lineinfile:
        path: /etc/postgresql/14/main/pg_hba.conf
        line: "host all all 10.0.0.0/8 md5"
      notify: Restart Postgres

    - name: UFW | Allow SSH traffic
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: UFW | Allow Postgres access ONLY from the application server
      community.general.ufw:
        rule: allow
        port: '5432'
        proto: tcp
        from_ip: "10.0.0.0/8"

    - name: UFW | Enable firewall and set default deny
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

  handlers:
    - name: Restart Postgres
      service:
        name: postgresql
        state: restarted
